body{background:radial-gradient(circle at 20% 0%,#2a3354,#12141c 65%) fixed;min-height:100vh}

.sq.m::after{background:#14551e80}.pw{color:#fff;-webkit-text-stroke:1px #222;text-shadow:none}.pb{color:#1b1b1b;text-shadow:0 1px 0 #fff5}

/* ===== v2 polish ===== */
.hero{text-align:center;padding:30px 20px}.hero .logo{font-size:60px;line-height:1;filter:drop-shadow(0 6px 10px #0008)}

.top{border-radius:16px}.top button{margin:0 2px;padding:7px 12px;font-size:14px}
#st{text-align:center;font-size:17px;font-weight:600;padding:12px;border-left:4px solid #6a93ff;border-radius:14px}
.g3{gap:10px;padding:14px;background:linear-gradient(#242a44,#1b2030);border-radius:22px;box-shadow:0 10px 30px #000a}
.cell{background:linear-gradient(#323a5e,#262d4a)}.cell.x{text-shadow:0 0 18px #6ea0ff}.cell.o{text-shadow:0 0 18px #ff7b9c}
.cb{max-width:min(100%,560px)}
/* UNO */
.uk{--k:#e53935;font-size:16px;width:3.9em;height:5.8em;border-radius:.65em;border:.22em solid #fff;background:var(--k);position:relative;flex:none;box-shadow:0 .25em .6em #0009;color:#fff;user-select:none;overflow:hidden;transition:transform .15s,filter .15s}
.uk .ov{position:absolute;inset:12% 5%;background:#fff;border-radius:50%;transform:rotate(-24deg);display:flex;align-items:center;justify-content:center}
.uk .ov span{transform:rotate(24deg);color:var(--k);font:900 1.9em/1 system-ui;text-shadow:.04em .05em 0 #0003}
.uk .cn{position:absolute;left:.32em;top:.2em;font:800 .8em/1 system-ui;font-style:normal;text-shadow:0 1px 0 #0005}
.uk .cn.br{left:auto;top:auto;right:.32em;bottom:.2em;transform:rotate(180deg)}
.uk.wild{background:#1b1b1b}.uk.wild .ov{background:conic-gradient(#e53935 0 25%,#f4b400 0 50%,#2e9d4a 0 75%,#1e73d8 0)}.uk.wild .ov span{color:#fff;text-shadow:0 .05em .15em #000}
.uk.wild.chosen .ov{background:var(--k)}
.uk.back{background:#161616}.uk.back .ov{background:#d32f2f}.uk.back .ov span{color:#ffd54f;font-size:1.15em;font-style:italic;letter-spacing:.02em}.uk.back .cn{display:none}
.uk.big{font-size:22px}.uk.sm{font-size:8px;border-width:2px}.uk.dim{filter:brightness(.5)}

.deck,.pile{position:relative;width:86px;height:128px}.pile{border-radius:14px;box-shadow:0 0 34px 6px var(--g);transition:box-shadow .3s}

.pick{display:flex;justify-content:center;align-items:center;gap:10px;margin:12px 0;font-weight:600}

/* ===== v3: responsive, chat, carrom ===== */
html{-webkit-text-size-adjust:100%}body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{width:100%;max-width:900px;padding:10px 10px 96px}button,.tile{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
input[type=text],input:not([type]){font-size:16px}
.cvw{width:100%;max-width:min(100%,600px,max(280px,calc(100dvh - 190px)));margin:auto;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px #000a;line-height:0}.cvw canvas{border-radius:0;max-width:100%}

/* ===== stability and small-screen hardening ===== */
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{min-width:0;align-items:flex-start}
#app{min-width:0;width:100%;max-width:900px;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
.card,.top,#gm,#mn{min-width:0;max-width:100%}
.row,.top,.pls,.tiles{min-width:0;max-width:100%}
button,input,select{max-width:100%;min-height:42px}
input{min-width:0}
canvas{max-width:100%;height:auto}
.cvw{width:100%;max-width:min(600px,calc(100dvh - 190px));aspect-ratio:1/1;height:auto;margin:0 auto;line-height:0}
.cvw canvas{display:block;width:100%;height:100%;aspect-ratio:1/1;max-width:100%;touch-action:none}
.ctl{width:100%;max-width:600px;margin:12px auto;gap:12px;padding:0 4px}
.ctl input{flex:1;min-width:100px;width:auto;min-height:34px}
.cb{width:100%;max-width:min(560px,calc(100dvh - 150px));}
.lw{width:100%;max-width:min(600px,calc(100dvh - 230px));}
.g3{width:100%;grid-template-columns:repeat(3,minmax(0,1fr))}
.cell{height:auto;aspect-ratio:1/1;min-width:0;font-size:clamp(28px,8vw,50px)}
.tiles{grid-template-columns:repeat(auto-fit,minmax(min(145px,100%),1fr))}

.hand{max-width:100%;justify-content:flex-start;overscroll-behavior-x:contain;scrollbar-width:thin}
#cpan{right:max(12px,env(safe-area-inset-right));bottom:calc(max(14px,env(safe-area-inset-bottom)) + 66px);max-height:calc(100dvh - 110px)}

@media(max-width:600px){#app{padding-top:6px}.top{justify-content:center}.top>span:first-child{margin-right:auto}.top #hb{display:flex;gap:5px}.top button{min-height:42px;padding:8px 10px}.cvw{max-width:min(100%,calc(100dvh - 205px))}.cb{max-width:min(100%,calc(100dvh - 185px))}.lw{max-width:min(100%,calc(100dvh - 245px))}.ops{min-height:64px}.op{padding:4px 6px}.mid{gap:20px}.cq{justify-content:space-around}.cq button{min-width:36px}}

/* ===== PlaySpace home, lobby and player-side Ludo dice ===== */
body{background:radial-gradient(ellipse at 12% 6%,#263d69 0,transparent 34%),radial-gradient(ellipse at 88% 30%,#3a2356 0,transparent 30%),linear-gradient(145deg,#0a1020,#11172a 58%,#0b1020)!important;color:#f4f6ff}

/*
  ICE configuration for players on different networks.
  OpenRelay's current static-auth endpoint is used by default. The optional
  Metered URL can be filled with app-specific TURN credentials for production.
*/
const METERED_TURN_CREDENTIALS_URL = '';
const ICE={
  iceServers:[
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'},
    {urls:'stun:openrelay.metered.ca:80'}
  ],

async function openRelayStaticIceServers(){
  if(!globalThis.crypto?.subtle)throw new Error('Web Crypto is unavailable; use HTTPS to enable TURN authentication.');
  // OpenRelay publishes this shared static-auth secret in its documentation.
  // TURN REST credentials are short-lived: expiry timestamp + HMAC-SHA1 password.
  const username=(Math.floor(Date.now()/1000)+3600)+':playspace';
  const secret=new TextEncoder().encode('openrelayprojectsecret');
  const key=await crypto.subtle.importKey('raw',secret,{name:'HMAC',hash:'SHA-1'},false,['sign']);
  const digest=await crypto.subtle.sign('HMAC',key,new TextEncoder().encode(username));
  let binary='';for(const b of new Uint8Array(digest))binary+=String.fromCharCode(b);
  const credential=btoa(binary);
  return [
    {urls:'turn:staticauth.openrelay.metered.ca:80',username,credential},
    {urls:'turn:staticauth.openrelay.metered.ca:80?transport=tcp',username,credential},
    {urls:'turn:staticauth.openrelay.metered.ca:443',username,credential},
    {urls:'turn:staticauth.openrelay.metered.ca:443?transport=tcp',username,credential},
    {urls:'turns:staticauth.openrelay.metered.ca:443',username,credential}
  ];

  let iceServers=[...ICE.iceServers],turnReady=false;
  if(METERED_TURN_CREDENTIALS_URL.trim()){
    try{
      const response=await fetch(METERED_TURN_CREDENTIALS_URL,{cache:'no-store'});
      if(!response.ok)throw new Error('TURN credential request returned HTTP '+response.status);
      const relayServers=await response.json();
      if(!Array.isArray(relayServers)||!relayServers.length)throw new Error('TURN server list was empty');
      iceServers=[...iceServers.filter(x=>String(x.urls).startsWith('stun:')),...relayServers];
      turnReady=true;
    }catch(e){console.warn('Could not load Metered TURN credentials; trying OpenRelay static auth.',e)}
  }
  if(!turnReady){
    try{iceServers.push(...await openRelayStaticIceServers())}
    catch(e){
      console.warn('OpenRelay static TURN credentials unavailable; using legacy relay fallback.',e);
      iceServers.push(

        {urls:'turns:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'}
      );
    }
  }
  return {config:{iceServers,iceCandidatePoolSize:ICE.iceCandidatePoolSize,sdpSemantics:ICE.sdpSemantics},debug:1};

/* ================= MULTIPLAYER NETWORK LAYER (VIBEO MEET STYLE) =================
   The original game UI and authoritative game engine remain unchanged.
   Host registers a stable room code in the first available PeerJS slot.
   Joining clients scan the same slots and retry when signaling drops.
   Lobby disconnects free seats; late joiners can enter as spectators.
*/
(function installMeetStyleMultiplayer(){
  let roomGen=1,searchGen=1,roomScanTimer=0,peerReconnectTimer=0,peerReconnectStep=0;
  let scanToken=0,scanFail=null,hostReady=false;
  // Keep old Peer objects alive when their signaling ID is lost: PeerJS can
  // preserve their already-open data channels while the host registers a new ID.
  let retiredPeers=[];
  const MAX_ROOM_SLOTS=25;
  const roomPeerId=slot=>'mgw-'+code+(slot>1?'-'+slot:'');
  function netStatus(message){
    const homeStatus=$('.home-error');if(homeStatus)homeStatus.textContent=message||'';
    const roomStatus=$('#bn');if(roomStatus)roomStatus.textContent=message||'';
  }
  function clearNetworkTimers(){
    clearTimeout(joinRetryTimer);clearTimeout(lostT);clearTimeout(roomScanTimer);clearTimeout(peerReconnectTimer);
    joinRetryTimer=lostT=roomScanTimer=peerReconnectTimer=0;
  }
  function keepPeerAlive(p,run){
    if(peer!==p||run!==peerRun||!p||p.destroyed)return;
    if(!p.disconnected)return;
    if(navigator.onLine){try{p.reconnect()}catch(e){console.warn('PeerJS reconnect attempt failed:',e)}}
    clearTimeout(peerReconnectTimer);
    const delay=Math.min(8000,1500+(peerReconnectStep++*1000));
    peerReconnectTimer=setTimeout(()=>keepPeerAlive(p,run),delay);
  }
  function rejectRoom(message){
    clearNetworkTimers();scanToken++;scanFail=null;peerRun++;
    const old=peer;peer=hc=null;R=HS=null;isHost=false;hostReady=false;
    try{old&&old.destroy()}catch(e){}
    home(message||'Could not join this room. Check the code and try again.');
  }
  function startHostPeer(run,options,slot=1,attempt=0){
    if(run!==peerRun||!isHost||!HS)return;
    if(slot>MAX_ROOM_SLOTS){
      hostReady=false;
      netStatus('The room has reached its address-recovery limit. Create a new room to let new players join.');
      return;
    }
    roomGen=slot;hostReady=false;
    let p;
    try{p=peer=new Peer(roomPeerId(slot),options)}
    catch(e){
      console.error('Could not create host Peer:',e);
      if(attempt<2){setTimeout(()=>startHostPeer(run,options,slot,attempt+1),1200*(attempt+1));return}
      netStatus('Could not start the multiplayer connection. Please try again.');return;
    }
    let opened=false,handedOff=false;
    const openWatch=setTimeout(()=>{
      if(peer!==p||opened||run!==peerRun)return;
      try{p.destroy()}catch(e){}
      if(peer===p)peer=null;
      if(attempt<2){netStatus('Signaling server is slow. Retrying room setup…');setTimeout(()=>startHostPeer(run,options,slot,attempt+1),1400*(attempt+1));}
      else{hostReady=false;netStatus('Could not reach the multiplayer server. Check your connection and try again.');}
    },20000);
    const moveRoomAddress=(reason)=>{
      if(handedOff||peer!==p||run!==peerRun||!isHost||!HS)return;
      handedOff=true;clearTimeout(openWatch);clearTimeout(peerReconnectTimer);
      peerReconnectTimer=0;peerReconnectStep=0;hostReady=false;
      const nextSlot=Math.max(slot,roomGen)+1;
      // Do NOT destroy an already-open Peer here: its existing DataConnections
      // may still carry the active match. The new Peer accepts future joiners.
      if(opened)retiredPeers.push(p);
      else{try{p.destroy()}catch(e){}}
      peer=null;
      netStatus(reason||'Refreshing the room address so new players can join…');
      setTimeout(()=>{if(run===peerRun&&isHost&&HS)startHostPeer(run,options,nextSlot,0)},450);
    };
    p.on('open',()=>{
      if(peer!==p||run!==peerRun||!isHost)return;
      opened=true;hostReady=true;peerReconnectStep=0;clearTimeout(openWatch);clearTimeout(peerReconnectTimer);peerReconnectTimer=0;
      netStatus('Room is online (address '+slot+'). Share code '+code+' with your friends.');
      bcast();
    });
    p.on('connection',c=>{if(peer===p&&run===peerRun)hconn(c)});
    p.on('disconnected',()=>{if(peer===p&&run===peerRun)keepPeerAlive(p,run)});
    p.on('close',()=>{
      clearTimeout(openWatch);
      if(peer!==p||run!==peerRun||!isHost||!HS||handedOff)return;
      peer=null;hostReady=false;
      clearTimeout(peerReconnectTimer);peerReconnectTimer=0;
      netStatus('Room signaling closed. Re-registering the room…');
      setTimeout(()=>{if(run===peerRun&&isHost&&HS)startHostPeer(run,options,roomGen,0)},1200);
    });
    p.on('error',e=>{
      if(peer!==p||run!==peerRun||handedOff)return;
      console.warn('Host PeerJS error:',e);
      if(e.type==='unavailable-id'){
        // This also happens AFTER a successful open when reconnect() discovers
        // that the old signaling ID has been claimed. Previously it was ignored,
        // leaving current players connected but making all future joins impossible.
        moveRoomAddress(opened
          ?'Refreshing the room address. Current players will stay in the match…'
          :'Room address is already in use. Trying another address…');
      }else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){
        if(!opened)netStatus('Connecting to the multiplayer service…');
        if(p.disconnected)keepPeerAlive(p,run);
      }
    });
  }
  function create(){
    getName();
    const run=++peerRun;
    clearNetworkTimers();scanToken++;scanFail=null;peerReconnectStep=0;joinAttempts=0;
    try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
    peer=hc=null;hostReady=false;roomGen=1;searchGen=1;
    isHost=true;
    code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[rnd(24)]).join('');
    CH=[];seenChat.clear();unread=0;
    HS={players:[{tok,name,on:1,last:Date.now(),lastSeq:0}],sel:'ttt',game:null,s:null,n:0,gid:0,rev:0,chat:CH,chatSeq:0};
    const createButton=$('.home-create');if(createButton)createButton.disabled=true;
    netStatus('Registering your room…');
    makePeerOptions()
      .then(options=>startHostPeer(run,options,1,0))
      .catch(e=>{
        console.error('Host ICE initialisation failed:',e);
        if(run===peerRun){HS=null;isHost=false;home('Unable to initialise multiplayer. Use HTTPS and check your internet connection, then try again.')}
      });
  }
  function join(){
    getName();code=$('#cd').value.trim().toUpperCase();
    if(code.length!==4)return home('Enter the 4-letter room code');
    isHost=false;joinAttempts=0;roomGen=1;searchGen=1;hostReady=false;
    clearNetworkTimers();scanToken++;scanFail=null;peerReconnectStep=0;
    try{if(peer&&!peer.destroyed)peer.destroy()}catch(e){}
    peer=hc=null;R=null;
    const joinButton=$('.home-join-row button');if(joinButton)joinButton.disabled=true;
    netStatus('Connecting to room '+code+'…');
    const run=++peerRun;mkpeer(run);
  }
  async function mkpeer(run=++peerRun){
    let options;
    try{options=await makePeerOptions()}
    catch(e){console.error('Client ICE initialisation failed:',e);if(run===peerRun)home('Unable to initialise multiplayer. Use HTTPS and check your internet connection.');return}
    if(run!==peerRun||isHost||!code)return;
    let p;
    try{p=peer=new Peer(options)}
    catch(e){console.error('Could not create client Peer:',e);if(run===peerRun)home('This browser could not start the multiplayer connection.');return}
    p.on('open',()=>{
      if(peer!==p||run!==peerRun||isHost)return;
      peerReconnectStep=0;clearTimeout(peerReconnectTimer);peerReconnectTimer=0;
      if(!(hc&&hc.open))scanRoom(1);
    });
    p.on('disconnected',()=>{if(peer===p&&run===peerRun)keepPeerAlive(p,run)});
    p.on('close',()=>{
      if(peer!==p||run!==peerRun||isHost)return;
      peer=hc=null;clearTimeout(peerReconnectTimer);peerReconnectTimer=0;
      if(code){const nextRun=++peerRun;setTimeout(()=>{if(nextRun===peerRun&&!isHost&&code)mkpeer(nextRun)},1000)}
    });
    p.on('error',e=>{
      if(peer!==p||run!==peerRun)return;
      console.warn('Client PeerJS error:',e);
      if(e.type==='peer-unavailable'){
        // PeerJS includes the unavailable destination in its error message.
        // Match it to the live scan so a delayed error from slot N cannot
        // accidentally cancel the valid connection attempt for slot N+1.
        const match=/Could not connect to peer\s+(.+?)\s*$/i.exec(String(e.message||''));
        const unavailableId=match?match[1].trim().replace(/[.,]$/,''):'';
        if(scanFail&&(!unavailableId||unavailableId===scanFail.peerId))scanFail('Room host not found at '+(scanFail.peerId||'this address')+'. Checking the next one…');
        else if(!scanFail&&!roomScanTimer&&!R)scanRoom(searchGen+1);
        else if(R)lost();
      }else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){
        if(R)lost();
        else{
          netStatus('Network connection interrupted. Reconnecting…');
          if(p.disconnected)keepPeerAlive(p,run);
          else if(!scanFail&&!roomScanTimer)roomScanTimer=setTimeout(()=>scanRoom(searchGen||1),1600);
        }
      }else if(e.type==='webrtc'){
        if(R)lost();
        else if(scanFail)scanFail('The room address responded, but WebRTC is retrying this same address…',searchGen,1800);
      }else if(['browser-incompatible','invalid-id','invalid-key','ssl-unavailable'].includes(e.type)){
        rejectRoom('This browser or page cannot establish WebRTC. Open the game over HTTPS in a current browser.');
      }
    });
  }
  function scanRoom(slot=1){
    if(!peer||peer.destroyed||peer.disconnected||isHost||!code)return;
    if(hc&&hc.open)return;
    clearTimeout(roomScanTimer);roomScanTimer=0;
    if(slot>MAX_ROOM_SLOTS){
      searchGen=1;netStatus('Still looking for the room host… Make sure the host keeps the room open.');
      roomScanTimer=setTimeout(()=>scanRoom(1),2500);return;
    }
    searchGen=slot;
    const p=peer,run=peerRun,ticket=++scanToken;
    let c;
    try{c=hc=p.connect(roomPeerId(slot),{reliable:true,serialization:'json'})}
    catch(e){console.warn('Room connection attempt failed:',e);hc=null;roomScanTimer=setTimeout(()=>scanRoom(slot+1),350);return}
    let opened=false,welcomed=false,failed=false,openWatch=0,handshakeWatch=0;
    const fail=(message,nextSlot=slot+1,delay=350)=>{
      if(failed||ticket!==scanToken||peer!==p||run!==peerRun||hc!==c||welcomed)return;
      failed=true;clearTimeout(openWatch);clearTimeout(handshakeWatch);
      if(scanFail===fail)scanFail=null;hc=null;
      try{c.close()}catch(e){}
      netStatus(message||'Checking the next room address…');
      roomScanTimer=setTimeout(()=>scanRoom(nextSlot),delay);
    };
    fail.peerId=roomPeerId(slot);fail.slot=slot;fail.ticket=ticket;
    scanFail=fail;
    // A real host can take longer than a few seconds to finish ICE/TURN
    // negotiation, especially on mobile or restrictive Wi-Fi. Do not skip its
    // address after the previous 7.5-second timeout.
    openWatch=setTimeout(()=>{if(!opened)fail('Room address is taking longer to connect. Retrying this address…',slot,1800)},22000);
    c.on('open',()=>{
      if(ticket!==scanToken||peer!==p||run!==peerRun||hc!==c)return;
      opened=true;clearTimeout(openWatch);netStatus('Connected to room address. Verifying room…');
      lastMsg=Date.now();outSeq=0;
      try{c.send({t:'h',tok,name})}catch(e){fail('Could not send the room handshake. Retrying…');return}
      handshakeWatch=setTimeout(()=>{if(!welcomed)fail('Host connection opened, but the room handshake is delayed. Retrying this address…',slot,1800)},15000);
    });
    c.on('data',m=>{
      if(ticket!==scanToken||peer!==p||run!==peerRun||hc!==c||!m)return;
      lastMsg=Date.now();
      if(m.t==='r'){
        welcomed=true;clearTimeout(openWatch);clearTimeout(handshakeWatch);clearTimeout(roomScanTimer);roomScanTimer=0;
        if(scanFail===fail)scanFail=null;joinAttempts=0;
        /* A restarted host begins its revision counter again; accept its fresh snapshot. */
        if(R&&Number(m.rev||0)<=Number(R.rev||0))R=null;
        onRoom(m);
      }else if(m.t==='c')gotChat(m.m);
      else if(m.t==='ch'){
        CH=(m.l||[]).slice(-60);seenChat.clear();CH.forEach(x=>{if(x&&x.id!=null)seenChat.add(x.id)});unread=0;chatUI();
      }else if(m.t==='x'){
        clearTimeout(openWatch);clearTimeout(handshakeWatch);rejectRoom(m.m||'The host rejected this room connection.');
      }
    });
    c.on('close',()=>{
      clearTimeout(openWatch);clearTimeout(handshakeWatch);
      if(ticket!==scanToken||peer!==p||run!==peerRun||hc!==c)return;
      if(welcomed||R){if(scanFail===fail)scanFail=null;hc=null;lost()}
      else if(opened)fail('Connection to this room address dropped. Retrying the same address…',slot,1400);
      else fail('Room address did not accept the connection. Checking the next one…');
    });
    c.on('error',e=>{
      if(ticket!==scanToken||peer!==p||run!==peerRun||hc!==c)return;
      console.warn('Room data connection error:',e);
      if(welcomed||R){if(scanFail===fail)scanFail=null;hc=null;lost()}
      else fail('WebRTC negotiation failed. Retrying this room address…',slot,1800);
    });
  }
  function lost(){
    if(isHost||!code||lostT)return;
    const b=$('#bn');if(b)b.textContent='⚠ Reconnecting…';
    lostT=setTimeout(()=>{
      lostT=0;if(isHost||!code)return;
      if(!peer||peer.destroyed){const run=++peerRun;mkpeer(run);return}
      if(peer.disconnected){keepPeerAlive(peer,peerRun);return}
      if(hc&&hc.open)return;
      scanRoom(1);
    },1500);
  }
  function leave(){
    ++peerRun;clearNetworkTimers();scanToken++;scanFail=null;joinAttempts=0;peerReconnectStep=0;hostReady=false;
    try{if(hc&&hc.open)hc.send({t:'b'})}catch(e){}
    const oldPeers=[peer,...retiredPeers].filter(Boolean);retiredPeers=[];peer=hc=HS=R=null;isHost=false;
    setTimeout(()=>{oldPeers.forEach(old=>{try{old.destroy()}catch(e){}})},200);
    home();
  }
  window.create=create;window.join=join;window.lost=lost;window.leave=leave;
  window.addEventListener('online',()=>{
    if(!code)return;
    if(peer&&peer.disconnected)keepPeerAlive(peer,peerRun);
    else if(!isHost&&!(hc&&hc.open))scanRoom(1);
  });
  window.addEventListener('offline',()=>netStatus('You are offline. Multiplayer will retry when your internet connection returns.'));
})();
home();
